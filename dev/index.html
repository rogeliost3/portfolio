<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Línea de Vida Profesional</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="timeline-title">Línea de vida profesional</h1>
  <div class="timeline-wrapper">
    <div class="timeline-scroll">
      <div id="era-line" class="era-line"></div>
      <div class="timeline" id="timeline"></div>
    </div>
  </div>  
  <div id="carousel" class="carousel-container">
    <button id="carousel-left" class="carousel-btn left">&#10094;</button>
    <div id="carousel-track" class="carousel-track"></div>
    <button id="carousel-right" class="carousel-btn right">&#10095;</button>
  </div>
  
  <button id="back-to-start" title="Volver al inicio">&#8678;</button>

  <div id="fullscreen-viewer">
    <img src="" alt="Imagen ampliada">
  </div>
  

  <script src="script.js"></script>
</body>
</html>
